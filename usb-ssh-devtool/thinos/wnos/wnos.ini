; ============================================================
; USB SSH Devtool — ThinOS 10.x Auto-Configuration
; ============================================================
; Place this file at the root of a FAT32 USB drive under:
;   \wnos\wnos.ini
;
; ThinOS reads this automatically when the USB is inserted
; or on next boot if USB is plugged in at startup.
; ============================================================

; ── Network (adjust to your environment) ─────────────────
; Uncomment and set if DHCP is not available
; NetworkSetting=Automode=1

; ── Enable SSH server on the ThinOS device ───────────────
; Allows inbound SSH connections to the thin client itself
SSHServer=yes
SSHPort=22

; ── SSH access credentials ────────────────────────────────
; ThinOS 10.x supports key-based auth via authorized_keys
; Place your public key file on the USB as \wnos\authorized_keys
; and reference it here
; SSHAuthorizedKeys=authorized_keys

; ── Admin/root password (for SSH login) ──────────────────
; ThinOS default admin user is 'Admin' (capital A)
; Set a strong password here or manage via WMS
; Passwd=YourStrongPassword encrypt=no

; ── Lock down password auth, prefer key-only ─────────────
SSHPasswordAuth=no

; ── Remote management ────────────────────────────────────
; Allow WMS/CCM remote shadowing and management
; RemoteConn=yes

; ── Optional: disable local UI lockout so SSH works ──────
; LockDown=no

; ── Syslog (useful for debugging SSH connections) ────────
; Syslog=192.168.1.100 Port=514

; ── Apply and reboot to activate ─────────────────────────
Reboot=no
