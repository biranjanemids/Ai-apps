# Single-node on-prem profile (design §12.4). The server runs the in-process
# control plane (Enrollment, DeviceLink, Transfer). PostgreSQL / Redis / MinIO /
# NATS are listed as the production backing services to wire in next.
services:
  mgmtserver:
    build:
      context: ..
      dockerfile: src/Ltsc.Server/Dockerfile
    ports:
      - "8443:8443"   # gRPC over mTLS; CA + server certs minted into server-state/

